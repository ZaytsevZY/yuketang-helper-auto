name: Android
on:
  pull_request:
    paths: ['ykt-helper-android/**', '.github/workflows/android.yml']
  push:
    paths: ['ykt-helper-android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ykt-helper-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-reports
          path: |
            ykt-helper-android/app/build/outputs/apk/
            ykt-helper-android/app/build/reports/
