<body class="lobby-page">
  <main class="lobby-card">
    <span class="eyebrow">LOCAL TEST LAB</span><h1>雨课堂本地双端测试课堂</h1>
    <p>所有课件、答题、XHR 与 WebSocket 信号都留在本机。先打开老师端，再另开学生端即可联调浏览器脚本、扩展或 Electron 应用。</p>
    <div class="role-grid">
      <a class="role-card teacher" href="/debug/teacher.html"><strong>老师页面</strong><span>播放测试 PPT、切换页面、发题并查看学生答案</span></a>
      <a class="role-card student" href="/lesson/fullscreen/v3/mock-lesson/exercise/3?ykt_mock=1"><strong>学生页面</strong><span>接收课件和题目、手动作答，并加载待测试的助手</span></a>
    </div>
    <p class="lobby-tip">建议把两个页面并排打开。学生页加 <code>&amp;inject=external</code> 可跳过内置助手，供浏览器插件或 EXE 自行注入。</p>
  </main>
</body>
</html>
